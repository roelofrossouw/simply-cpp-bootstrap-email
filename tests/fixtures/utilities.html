<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <title>Utilities</title>
  <style data-premailer="ignore">.keep-me { color: purple; }</style>
</head>
<body>
  <div class="container-fluid bg-gray-100">
    <div class="row">
      <div class="col-12 col-lg-6 text-center">
        <h2 class="text-primary fw-bold">Heading two</h2>
        <h4 class="lh-sm">Heading four</h4>
        <ul class="text-muted"><li>One</li><li>Two</li></ul>
        <ol><li>First</li></ol>
      </div>
      <div class="col-12 col-lg-6 border rounded-lg shadow">
        <img src="https://example.com/café.png" width="120" alt="Café" class="w-24 h-auto ax-left">
        <table class="table table-striped w-full">
          <thead><tr><th>Name</th><th class="text-right">Total</th></tr></thead>
          <tbody><tr><td>Tea</td><td class="text-right">R 25,00</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="row space-y-2"><div class="col-4">a</div><div class="col-4">b</div><div class="col-4 mb-3">c</div></div>
    <p class="text-xs text-gray-500 my-lg-6 px-lg-4">Small print, <em>emphasis</em>, <code>code</code><br>and a break.</p>
    <a class="btn btn-success btn-lg w-full" href="https://example.com/?a=1&b=2">Large green</a>
    <div class="alert alert-info border-0 rounded-0"><strong>Note:</strong> info alert</div>
    <span class="badge bg-danger text-white">9+</span>
    <div class="stack-col"><div>Row one</div><div class="bg-blue-100">Row two</div></div>
    <div class="hidden d-none">Hidden</div>
    <div class="s-lg-8"></div>
    <div contenteditable="true" class="text-justify">Editable text</div>
    <script>alert("gone")</script>
  </div>
</body>
</html>
